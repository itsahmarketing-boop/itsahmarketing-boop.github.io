<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>বার্তা · AH Marketing Agency</title>
<meta name="description" content="AH Marketing Agency এর খবর, টিপস আর সোশ্যাল মিডিয়া পোস্ট: ই-পেপার আকারে এক জায়গায়।">
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;800&family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"UN Bangla";src:url("/fonts/UNBangla-Regular.ttf") format("truetype");font-weight:400;font-display:swap}@font-face{font-family:"UN Bangla";src:url("/fonts/UNBangla-Bold.ttf") format("truetype");font-weight:600 800;font-display:swap}
:root{--ink:#111827;--sub:#4b5563;--mute:#9ca3af;--line:#e5e7eb;--paper:#fbfaf7;--card:#fff;--p:#4f46e5;--p2:#7c3aed;--r:18px}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:"UN Bangla",Poppins,sans-serif;font-size:16px;line-height:1.65}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{background:#0f172a;color:#cbd5e1;font-size:13px}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap}
.top nav{display:flex;gap:16px}.top nav a{text-decoration:none;color:#e2e8f0}.top nav a:hover{color:#fff}
.mast{border-bottom:3px double var(--ink);padding:26px 0 14px;text-align:center}
.mast .brand{display:inline-flex;align-items:center;gap:14px;text-decoration:none}
.mast img{width:54px;height:54px}
.mast h1{margin:0;font-family:"UN Bangla",serif;font-weight:800;font-size:clamp(34px,6vw,64px);letter-spacing:-.01em;line-height:1.1}
.mast .tag{margin:8px 0 0;color:var(--sub);font-size:15px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding:10px 0;font-size:14px}
.bar .date{font-weight:600}
.soc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.soc span{color:var(--sub);margin-right:4px}
.ic{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;text-decoration:none;transition:transform .15s}
.ic:hover{transform:translateY(-2px)}.ic svg{width:17px;height:17px;fill:currentColor}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lead{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;margin:26px 0 8px;padding-bottom:28px;border-bottom:1px solid var(--line);cursor:pointer}
.lead .media{border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,var(--p),var(--p2));min-height:280px;display:grid;place-items:center}
.lead .media img,.lead .media iframe{width:100%;height:100%;object-fit:cover;border:0;display:block;aspect-ratio:16/10}
.ph{color:#fff;font-family:"UN Bangla",serif;font-size:22px;padding:28px;text-align:center;opacity:.95}
.kick{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--p)}
.lead h2{font-family:"UN Bangla",serif;font-size:clamp(26px,3.4vw,40px);line-height:1.25;margin:8px 0 12px}
.lead p{color:var(--sub);font-size:17px;margin:0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--mute);margin-top:12px}
.sec{display:flex;align-items:center;gap:12px;margin:30px 0 16px;font-family:"UN Bangla",serif;font-size:22px;font-weight:800}
.sec::after{content:"";flex:1;height:2px;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(15,23,42,.35)}
.card .media{aspect-ratio:16/10;background:linear-gradient(135deg,#eef2ff,#f5f3ff);display:grid;place-items:center}
.card .media img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph{color:var(--p);font-size:18px}
.card .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-family:"UN Bangla",serif;font-size:20px;line-height:1.35}
.card p{margin:0;color:var(--sub);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 5px;background:#fff}
.lk i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}.lk i svg{width:11px;height:11px;fill:currentColor}
.empty{color:var(--sub);text-align:center;padding:60px 0}
.rd{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px}
.rd article{background:#fff;max-width:760px;width:100%;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.rd .media img,.rd .media iframe{width:100%;aspect-ratio:16/9;object-fit:cover;border:0;display:block}
.rd .in{padding:26px 30px 30px}.rd h2{font-family:"UN Bangla",serif;font-size:clamp(24px,3vw,34px);line-height:1.3;margin:6px 0 14px}
.rd .txt{white-space:pre-line;font-size:17.5px;line-height:1.85;color:#1f2937}
.rd .x{position:sticky;top:0;float:right;margin:12px;border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);align-items:center;font-size:14px;color:var(--sub)}
.share button,.share a{font:inherit;font-size:13.5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;text-decoration:none;color:var(--ink)}
footer{margin-top:50px;border-top:3px double var(--ink);padding:22px 0 40px;text-align:center;color:var(--sub);font-size:14px}
@media (max-width:820px){.lead{grid-template-columns:1fr;gap:16px}.lead .media{min-height:200px}.bar{justify-content:center;text-align:center}.rd .in{padding:20px}}
</style></head><body>
<div class="top"><div class="wrap"><span>AH Marketing Agency · ই-পেপার</span><nav><a href="index.html">হোম</a><a href="index.html#services">সার্ভিস</a><a href="news.html">বার্তা</a><a href="index.html#contact">যোগাযোগ</a></nav></div></div>
<div class="wrap">
  <header class="mast"><a class="brand" href="index.html"><img src="logo.svg" alt="AH Marketing লোগো"><h1>AH Marketing বার্তা</h1></a>
    <p class="tag">ডিজিটাল মার্কেটিং, সোশ্যাল মিডিয়া আর ব্যবসার টিপস: প্রতিদিন</p></header>
  <div class="bar"><span class="date" id="today"></span><div class="soc" id="soc"><span>আমাদের অনুসরণ করুন:</span></div></div>
  <div class="chips" id="chips"></div>
  <main id="feed"><p class="empty">লোড হচ্ছে…</p></main>
</div>
<footer><div class="wrap">© <span id="yr"></span> AH Marketing Agency · <a href="index.html">হোম</a> · <a href="privacy.html">Privacy Policy</a></div></footer>
<script>
(function(){
  /* আমাদের সোশ্যাল মিডিয়া: নতুন অ্যাকাউন্ট হলে এখানে যোগ করুন */
  var SOCIALS=[
    {n:"Facebook",u:"https://www.facebook.com/itisahmarketing"},
    {n:"YouTube",u:"https://www.youtube.com/channel/UC0poQdKvEh8jRjeVHDTuGUg"}
  ];
  var P={
    Facebook:["#1877f2","M14 8h3V4h-3c-2.8 0-4 1.7-4 4.3V10H7v4h3v8h4v-8h3l1-4h-4V8.6c0-.4.3-.6.7-.6z"],
    YouTube:["#ff0000","M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.5 12a31 31 0 0 0-.5-4.8zM9.7 15.1V8.9L15.5 12z"],
    Instagram:["#e1306c","M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2A3.2 3.2 0 1 1 12 8.8a3.2 3.2 0 0 1 0 6.4zM17.3 5.4a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM12 2c2.7 0 3 0 4.1.1 4.2.2 5.6 1.6 5.8 5.8.1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.2 4.2-1.6 5.6-5.8 5.8-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1C3.7 21.7 2.3 20.3 2.1 16.1 2 15 2 14.7 2 12s0-3 .1-4.1C2.3 3.7 3.7 2.3 7.9 2.1 9 2 9.3 2 12 2z"],
    LinkedIn:["#0a66c2","M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V21h-4z"],
    Bluesky:["#0085ff","M5.2 3.6C7.9 5.6 10.8 9.7 12 11.9c1.2-2.2 4.1-6.3 6.8-8.3 1.9-1.4 5.2-2.6 5.2 1 0 .7-.4 6-.7 6.9-.9 3.2-4.2 4-7.1 3.5 5.1.9 6.4 3.7 3.6 6.6-5.3 5.4-7.6-1.4-8.2-3.1L12 18l-.4.5c-.6 1.7-2.9 8.5-8.2 3.1-2.8-2.9-1.5-5.7 3.6-6.6-2.9.5-6.2-.3-7.1-3.5C-.4 10.6 0 5.3 0 4.6c0-3.6 3.3-2.4 5.2-1z"],
    TikTok:["#111111","M16.5 2c.3 2.4 1.7 3.9 4 4v3.1a7 7 0 0 1-4-1.3v6.6c0 4.3-3.4 6.6-6.6 6.6-3.6 0-6.4-2.8-6.4-6.3 0-3.9 3.4-6.8 7.5-6.2v3.4c-1.9-.6-4 .7-4 2.8 0 1.7 1.3 2.9 2.9 2.9 1.8 0 3.1-1.3 3.1-3.3V2z"],
    X:["#000000","M17.8 3h3.3l-7.2 8.2L22.3 21h-6.6l-5.2-6.8L4.6 21H1.3l7.7-8.8L1 3h6.8l4.7 6.2zm-1.2 16h1.8L7.5 4.9H5.5z"],
    Telegram:["#229ed9","M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8s.6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.3c.3-1.3-.5-1.8-1.3-1.5zM9.6 14.2l8.7-5.5c.4-.3.8-.1.5.2l-7.3 6.6-.3 3.2z"]
  };
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  var ico=function(n){var k=Object.keys(P).filter(function(x){return String(n).toLowerCase().indexOf(x.toLowerCase())===0;})[0];return k?P[k]:null;};
  var svg=function(p){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+p[1]+'"/></svg>';};
  var dt=function(d){return d?new Date(d).toLocaleDateString("bn-BD",{day:"numeric",month:"long",year:"numeric"}):"";};
  document.getElementById("today").textContent=new Date().toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("yr").textContent=new Date().getFullYear();
  document.getElementById("soc").insertAdjacentHTML("beforeend",SOCIALS.map(function(s){var p=ico(s.n)||["#475569",""];return '<a class="ic" style="background:'+p[0]+'" href="'+esc(s.u)+'" target="_blank" rel="noopener" title="'+esc(s.n)+'" aria-label="'+esc(s.n)+'">'+(p[1]?svg(p):esc(s.n[0]))+'</a>';}).join(""));
  var cur=new URLSearchParams(location.search).get("page")||"", all=[];
  var media=function(p,big){ if(p.yt) return big?'<iframe loading="lazy" src="https://www.youtube.com/embed/'+esc(p.yt)+'" allowfullscreen></iframe>':'<img loading="lazy" src="https://i.ytimg.com/vi/'+esc(p.yt)+'/hqdefault.jpg" alt="">';
    if(p.img) return '<img loading="lazy" src="'+esc(p.img)+'" alt="">'; return '<div class="ph">'+esc(p.title||"AH Marketing")+'</div>'; };
  var links=function(p){return (p.links||[]).map(function(l){var c=ico(l.name);return '<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+(c?'<i style="background:'+c[0]+'">'+svg(c)+'</i>':'')+esc(l.name)+'-এ দেখুন</a>';}).join("");};
  function open(p){
    var u=location.href.split("#")[0]+"#"+p.id, w=document.createElement("div"); w.className="rd";
    w.innerHTML='<article><button class="x" aria-label="বন্ধ">✕</button>'+((p.img||p.yt)?'<div class="media">'+media(p,true)+'</div>':'')+'<div class="in"><span class="kick">'+esc(p.page||"")+'</span><h2>'+esc(p.title||"")+'</h2><div class="meta">'+esc(dt(p.date))+'</div><div class="txt">'+esc(p.text)+'</div>'
      +(links(p)?'<div class="links" style="margin-top:18px">'+links(p)+'</div>':'')
      +'<div class="share">শেয়ার করুন: <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)+'">Facebook</a><a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent((p.title||"")+" "+u)+'">WhatsApp</a><button type="button" data-copy>লিংক কপি</button></div></div></article>';
    document.body.appendChild(w); document.body.style.overflow="hidden"; history.replaceState(null,"","#"+p.id);
    var close=function(){w.remove();document.body.style.overflow="";history.replaceState(null,"",location.pathname+location.search);};
    w.onclick=function(e){if(e.target===w)close();}; w.querySelector(".x").onclick=close;
    w.querySelector("[data-copy]").onclick=function(){try{navigator.clipboard.writeText(u);this.textContent="কপি হয়েছে ✓";}catch(e){}};
  }
  function render(){
    var list=all.filter(function(p){return !cur||p.page===cur;}), f=document.getElementById("feed");
    if(!list.length){f.innerHTML='<p class="empty">এখনো কোনো খবর নেই। শিগগিরই আসছে।</p>';return;}
    var L=list[0], rest=list.slice(1);
    var h='<article class="lead" data-i="0"><div class="media">'+media(L,false)+'</div><div><span class="kick">প্রধান খবর · '+esc(L.page||"")+'</span><h2>'+esc(L.title||"")+'</h2><p>'+esc(L.text)+'</p><div class="meta">'+esc(dt(L.date))+' · পুরো পড়ুন →</div>'+(links(L)?'<div class="links" style="margin-top:12px">'+links(L)+'</div>':'')+'</div></article>';
    if(rest.length) h+='<div class="sec">আরও খবর</div><div class="grid">'+rest.map(function(p,i){return '<article class="card" data-i="'+(i+1)+'"><div class="media">'+media(p,false)+'</div><div class="b"><span class="kick">'+esc(p.page||"")+' · '+esc(dt(p.date))+'</span><h3>'+esc(p.title||"")+'</h3><p>'+esc(p.text)+'</p>'+(links(p)?'<div class="links">'+links(p)+'</div>':'')+'</div></article>';}).join("")+'</div>';
    f.innerHTML=h;
    f.querySelectorAll("[data-i]").forEach(function(a){a.onclick=function(){open(list[+a.dataset.i]);};});
  }
  function chips(){
    var pages=[];all.forEach(function(p){if(p.page&&pages.indexOf(p.page)===-1)pages.push(p.page);});
    var c=document.getElementById("chips"); if(pages.length<2){c.innerHTML="";return;}
    c.innerHTML=['<button type="button" data-p="">সব</button>'].concat(pages.map(function(n){return '<button type="button" data-p="'+esc(n)+'">'+esc(n)+'</button>';})).join("");
    c.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.p===cur);b.onclick=function(){cur=b.dataset.p;chips();render();};});
  }
  fetch("posts.json?v="+Date.now()).then(function(r){return r.json();}).then(function(j){all=Array.isArray(j)?j:[];chips();render();
      var h=location.hash.slice(1); if(h){var p=all.filter(function(x){return x.id===h;})[0]; if(p) open(p);} })
    .catch(function(){document.getElementById("feed").innerHTML='<p class="empty">এখনো কোনো খবর নেই।</p>';});
})();
</script>
</body></html>
